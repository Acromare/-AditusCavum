spring.application.name=AditusCavum

# OpenAI-compatible model configuration. Keep secrets in environment variables.
aditus-cavum.model.base-url=${ADITUS_MODEL_BASE_URL:https://api.openai.com/v1}
aditus-cavum.model.api-key=${ADITUS_MODEL_API_KEY:}
aditus-cavum.model.model=${ADITUS_MODEL_NAME:gpt-4o-mini}
aditus-cavum.chat.max-tool-rounds=${ADITUS_MAX_TOOL_ROUNDS:5}
aditus-cavum.chat.max-memory-messages=${ADITUS_MAX_MEMORY_MESSAGES:20}
aditus-cavum.chat.system-prompt=${ADITUS_SYSTEM_PROMPT:}
