<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AditusCavum</title>
<style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:0 16px}textarea{width:100%;height:100px}button{padding:9px 14px;margin-top:8px}.msg{white-space:pre-wrap;border-bottom:1px solid #ddd;padding:12px 0}</style></head>
<body><h1>AditusCavum</h1><div id="messages"></div><textarea id="message" placeholder="输入问题"></textarea><br><button onclick="send()">发送</button><button onclick="fresh()">新会话</button>
<script>let id=localStorage.aditusConversation||crypto.randomUUID();const out=document.querySelector('#messages');function fresh(){id=crypto.randomUUID();localStorage.aditusConversation=id;out.innerHTML=''}async function send(){const el=document.querySelector('#message'),message=el.value.trim();if(!message)return;out.innerHTML+='<div class="msg"><b>你：</b>'+esc(message)+'</div>';el.value='';const r=await fetch('api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:id,message})});const d=await r.json();out.innerHTML+='<div class="msg"><b>AI：</b>'+esc(d.answer||'请求失败')+'</div>'}function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</script></body></html>
