<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AditusCavum Console</title><style>body{font:15px system-ui;max-width:1000px;margin:36px auto;padding:0 18px}section{border:1px solid #ddd;padding:16px;margin:12px 0}code{background:#f2f2f2;padding:3px 6px}</style></head><body><h1>AditusCavum Console</h1><section id="status">加载中...</section><script>fetch('api/status').then(r=>r.json()).then(s=>{document.querySelector('#status').innerHTML='<p>模型：<code>'+s.model+'</code></p><p>知识分块：<code>'+s.knowledgeChunks+'</code>，Top-K：<code>'+s.knowledgeTopK+'</code></p><p>工具：'+(s.tools.length?s.tools.map(t=>'<code>'+t+'</code>').join(' '):'无')+'</p>'}).catch(e=>document.querySelector('#status').textContent='控制台接口不可用：'+e)</script></body></html>
